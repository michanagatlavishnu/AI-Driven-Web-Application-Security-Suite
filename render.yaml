services:
  # ----------------------------------------------------
  # 1. Backend Web Service (Node.js + Express API)
  # ----------------------------------------------------
  - type: web
    name: security-suite-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_SSL
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # ----------------------------------------------------
  - type: web
    name: security-suite-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
